services:
  db:
    image: postgres:15
    container_name: pii_guard_db
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret_password}
    ports:
      - "5434:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d testdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: pii_guard_app
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_DB: testdb
      # На стенде приложение по-прежнему стартует под admin, чтобы
      # init_db_logic.sql мог CREATE EXTENSION / CREATE ROLE. В проде нужно:
      #   1) применить init_db_logic.sql разово от суперюзера,
      #   2) выставить здесь POSTGRES_USER=pii_guard_app + PG_APP_PASSWORD,
      #   3) приложение начнёт работать с минимальными правами и больше не
      #      сможет отключить триггер защиты audit_log (DISABLE TRIGGER).
      POSTGRES_USER: ${DB_APP_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret_password}
      DB_HOST: db
      DB_PORT: 5432
      # SECRET_KEY обязательно задавать через .env в любой не-локальной среде;
      # fallback здесь — только чтобы docker compose up на чистом стенде не падал.
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-plz}
    ports:
      - "5000:5000"
    # Bind mount убран: он шадовал образ (включая симлинк на DejaVuSans.ttf,
    # созданный в Dockerfile) и ломал PDF-отчёт на Windows-хосте. Для hot-reload
    # в разработке смонтируйте только templates/static/, а не весь проект.

volumes:
  pg_data:
