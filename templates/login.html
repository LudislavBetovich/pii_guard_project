<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PII Guard — Вход</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-dark d-flex align-items-center justify-content-center" style="min-height:100vh">

<div class="card shadow-lg" style="width:360px">
  <div class="card-header bg-dark text-white text-center py-3">
    <h5 class="mb-0">
      <i class="bi bi-shield-fill-check text-success me-2"></i>PII Guard
    </h5>
    <small class="text-secondary">Система обезличивания конфиденциальных данных</small>
  </div>
  <div class="card-body p-4">
    {% if error %}
      <div class="alert alert-danger py-2 text-center">
        <i class="bi bi-exclamation-triangle-fill me-1"></i>{{ error }}
      </div>
    {% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label fw-semibold">Логин</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" name="username" class="form-control"
                 placeholder="username" autofocus autocomplete="username" required>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Пароль</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" name="password" class="form-control"
                 placeholder="••••••••" autocomplete="current-password" required>
        </div>
      </div>
      <button type="submit" class="btn btn-success w-100">
        <i class="bi bi-box-arrow-in-right me-1"></i>Войти
      </button>
    </form>
  </div>
  <div class="card-footer text-center text-muted small py-2">
    Используйте учётные данные администратора системы
  </div>
</div>

</body>
</html>
